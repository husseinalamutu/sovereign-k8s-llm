# 05-initcontainer-download.yaml
# ==============================================================================
# OFFLINE / AIR-GAPPED FRIENDLY PATTERN:
# Uses an initContainer to download the quantized GGUF weights into a shared
# volume, isolating model download from inference runtime.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-llm-initcontainer
  namespace: sovereign-ai
  labels:
    app: sovereign-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereign-llm
  template:
    metadata:
      labels:
        app: sovereign-llm
    spec:
      volumes:
      - name: model-volume
        emptyDir: {}
      initContainers:
      - name: model-fetcher
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "[*] Installing huggingface_hub..."
            pip install -q huggingface_hub
            echo "[*] Downloading tiny-aya-earth-yoruba-Q4_K_M.gguf to shared volume..."
            python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='husseinalamutu/tiny-aya-earth-yoruba-gguf', filename='tiny-aya-earth-yoruba-Q4_K_M.gguf', local_dir='/models')"
            echo "[+] Model download complete. Files in /models:"
            ls -lh /models
        volumeMounts:
        - name: model-volume
          mountPath: /models
        resources:
          limits:
            cpu: "1000m"
            memory: "1000Mi"
      containers:
      - name: llama-server
        image: ghcr.io/ggerganov/llama.cpp:server
        args:
          - "-m"
          - "/models/tiny-aya-earth-yoruba-Q4_K_M.gguf"
          - "-c"
          - "2048"
          - "-t"
          - "4"
          - "--port"
          - "8080"
          - "--host"
          - "0.0.0.0"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: model-volume
          mountPath: /models
          readOnly: true
        resources:
          requests:
            cpu: "1000m"
            memory: "2500Mi"
          limits:
            cpu: "2000m"
            memory: "4500Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
